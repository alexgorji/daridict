{% extends 'base.html' %}
{% block title %}
    Item: {{ dictitem }}
{% endblock %}
{% block content %}
    <p>Item: <strong>{{ dictitem.value }}</strong> <a href="{% url 'dict_item_update' dictitem.pk %}">Edit</a></p>
    <p>Language: <a href="{% url 'dict_language' dictitem.language.pk %}">{{ dictitem.language }}</a></p>
    <p>Comment:
        <span {% if dictitem.language.direction == 'RTL' %} dir="rtl" {% endif %}>{{ dictitem.comment }}</span>
    </p>
    {% for entry in dictitem.get_entries %}
        <div class="d-flex">
            <p><a href="{% url 'dict_entry_update' entry.pk%}">{{ entry }}</a></p>
        </div>
    {% endfor %}
{% endblock %}
