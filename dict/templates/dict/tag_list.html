{% extends 'base.html' %}
{% block title %}
    Tags
{% endblock %}
{% block content %}
    {% for tag in tag_list %}
        <div class="d-flex">
            <div><a href="{% url 'tag_detail' tag.pk %}">{{ tag }}</a></div>
            <div class="ps-3 pe-3">entries: {{ tag.dictentry_set.count }}</div>
            <form action="" method="POST">
                {% csrf_token %}
                <input type="hidden" name="selected-tag-id" value={{ tag.id }}>
                <input type="hidden" name="tag-delete" value="Delete">
                <input class="btn rounded-pill py-0 edit-button" type="submit"
                       onclick="return confirm('Are you sure?')" value="del">
            </form>
        </div>
    {% endfor %}

{% endblock %}
