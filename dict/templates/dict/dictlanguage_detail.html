{% extends 'base.html' %}
{% block title %}
    Language: {{ dictlanguage }}
{% endblock %}
{% block content %}
    <h2>{{ dictlanguage }}</h2>
    {% for item in dictlanguage.get_sorted_items %}
        <div class="d-flex">
            <div><a href="{% url 'dict_item' item.pk %}">{{ item.id }}: {{ item.value }}</a></div>
            <div class="ps-3 pe-3">entries: {{ item.get_entries|length }}</div>
            <form action="" method="POST">
                {% csrf_token %}
                <input type="hidden" name="selected-item-id" value={{ item.id }}>
                <input type="hidden" name="item-delete" value="Delete">
                <input class="btn rounded-pill py-0 edit-button" type="submit"
                       onclick="return confirm('Are you sure?')" value="del">
            </form>
        </div>
    {% endfor %}
{% endblock %}
