{% extends 'base.html' %}
{% block title %}
    Language: {{ dictlanguage }}
{% endblock %}
{% block content %}
    <h2>{{ dictlanguage }}</h2>
    {% for item in dictlanguage.dictitem_set.all %}
        <div class="d-flex">
            <div><a href="{% url 'dict_item' item.pk %}">{{ item.id }}: {{ item.value }}</a></div>
            <div class="ps-3">nodes: {{ item.get_number_of_nodes }}</div>
        </div>
    {% endfor %}
{% endblock %}
