<div class="d-flex">
    <form class="entry-form" method="post" novalidate autocomplete="off">
        {% csrf_token %}
        {% for form in item_forms %}
            {% for field in form %}
                {{ field }}
                <div id="{{ field.auto_id }}_autocomplete" style="position: absolute" class="autocomplete">
                    <div></div>
                </div>
                <p></p>
            {% endfor %}
        {% endfor %}
        <input type="text" name="tag_names" id="id_tag_names" placeholder="Tag(s)"
               value="{{ entry.get_tags_as_string }}">
        <div id="id_tag_names_autocomplete" style="position: absolute" class="autocomplete">
            <div></div>
        </div>
        <p></p>
        <p></p>
{#        <input type="hidden" name="selected_entry_id" value="{{ selected_entry_id }}">#}
        <button class="btn bg-light {{ entry_save_display }}" name="entry-save" type="button">Save</button>
{#        <button class="btn bg-light {{ entry_copy_display }}" name="entry-copy" type="button">Copy</button>#}
        <button class="btn bg-light {{ entry_update_display }}" name="entry-update" type="button" data-entry-id="{{ selected_entry_id }}">Update</button>
{#        <input class="btn bg-light {{ entry_save_display }}" type="submit" name="entry-save" value="Save">#}
{#        <input class="btn bg-light {{ entry_copy_display }}" type="submit" name="entry-copy" value="Copy">#}
{#        <input class="btn bg-light {{ entry_update_display }}" type="submit" name="entry-update" value="Update">#}
    </form>
    <button class="btn bg-light {{ entry_cancel_display }} cancel-button" onclick="cancelClick()">Cancel</button>
</div>
