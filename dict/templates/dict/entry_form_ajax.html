<form method="post" novalidate>{% csrf_token %}
    {% for form in item_forms %}
        {% for field in form %}
            <p>{{ field }}</p>
        {% endfor %}
    {% endfor %}

    {{ item_forms.as_p }}
    <input type="hidden" name="selected_entry_id" value="{{ selected_entry_id }}">
    <input class="btn bg-light {{ entry_save_display }}" type="submit" name="entry-save" value="Save">
    <input class="btn bg-light {{ entry_copy_display }}" type="submit" name="entry-copy" value="Copy">
    <input class="btn bg-light {{ entry_update_display }}" type="submit" name="entry-update" value="Update">
    <input class="btn bg-light {{ entry_cancel_display }}" type="submit" name="entry-cancel" value="Cancel">
{#    <input class="btn bg-light" type="submit" name="delete" onclick="return confirm('Are you sure?')" value="del">#}
</form>
