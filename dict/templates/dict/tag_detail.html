{% extends 'base.html' %}
{% block title %}
    Tag: {{ tag }}
{% endblock %}
{% block content %}
    <p>Tag: <strong>{{ tag.name }}</strong></p>
    {% for dictentry in tag.dictentry_set.all %}
        <div class="d-flex">
            <p><a href="{% url 'dict_entry_update' dictentry.pk %}">{{ dictentry }}</a></p>
        </div>
    {% endfor %}
{% endblock %}
