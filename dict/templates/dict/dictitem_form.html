{% extends 'base.html' %}
{% block title %}
    Dari Dictionary Edit Item: {{ dictitem }}
{% endblock %}
{% block content %}
    <form method="post" novalidate>{% csrf_token %}
        {{ form.as_p }}
        <input class="btn bg-light" type="submit" name="update" value="Update">
        <input class="btn bg-light" type="submit" name="delete" onclick="return confirm('Are you sure?')" value="del">
        <a href="{% url 'dict_item' dictitem.pk %}" class="btn bg-light">Cancel<a>
    </form>
{% endblock %}
