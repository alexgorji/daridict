{% extends 'base.html' %}
{% block title %}
    Dari Dictionary Edit Item: {{ dictitem }}
{% endblock %}
{% block content %}
    <p>Language: <a href="{% url 'dict_language' dictitem.language.pk %}">{{ dictitem.language }}</a></p>
    <form method="post" novalidate>{% csrf_token %}
        <div {% if dictitem.language.value != 'German' %}class="child_input_rtl"{% endif %}>
            {{ form.as_p }}
        </div>

        <div class="d-flex gap-1">
            <input class="btn bg-light" type="submit" name="update" value="Update">
            <input class="btn bg-light" type="submit" name="delete" onclick="return confirm('Are you sure?')"
                   value="del">
            <a href="{% url 'dict_item' dictitem.pk %}" class="btn bg-light">Cancel<a>
        </div>
    </form>
{% endblock %}
