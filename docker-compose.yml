# Local development only. Do not reuse these credentials elsewhere.
x-postgres-env: &postgres-env
  POSTGRES_DB: daridict_db
  POSTGRES_USER: daridict
  POSTGRES_PASSWORD: daridict-local-dev

services:
  backend:
    build: .
    environment: *postgres-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-ec", "python manage.py migrate --noinput; exec python manage.py runserver 0.0.0.0:8000"]
    ports:
      - "127.0.0.1:${DARIDICT_PORT:-1234}:8000"

  postgres:
    image: postgres:17-bookworm
    environment: *postgres-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
