{% extends 'base.html' %}
{% block title %}
    Update Profile
{% endblock %}
{% block main %}
    <section class="wrapper">
        <div class="login">
            <form class="login__form" method="post" novalidate>
                {{ form.as_p }}
                {% csrf_token %}
                <input class="login__button" type="submit" value="Save" name="profile_update_save">
                <input class="login__button" type="submit" value="Cancel" name="profile_update_cancel">
                <input class="login__button" type="submit" value="Delete" name="profile_delete">
            </form>
        </div>
    </section>
{% endblock %}
