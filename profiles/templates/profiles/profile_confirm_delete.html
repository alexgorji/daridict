{% extends 'base.html' %}
{% block title %}
    Delete Profile
{% endblock %}
{% block main %}
    <section class="wrapper">
        <div class="login">
            <div class="login__header">
                <div> Are you sure you want to delete "{{ object.get_full_name }}"?</div>
            </div>
            <form class="login__form" method="post" novalidate>
                {% csrf_token %}
                <input class="login__button" type="submit" value="Yes">
                <a class="link__button" href="{% url 'profiles_update' object.id %}">No</a>
            </form>
        </div>
    </section>
{% endblock %}
